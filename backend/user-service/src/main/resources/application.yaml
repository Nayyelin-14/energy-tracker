spring:
  application:
    name: userservice

  # --- MySQL ---
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:home_energy_tracker}?sslMode=DISABLED&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:energy_app}
    password: ${MYSQL_PASSWORD:EnergyApp_2026_Strong!}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # --- Flyway (owns the schema; runs before Hibernate on every boot) ---
  flyway:
    locations: classpath:db/migration
    baseline-on-migrate: false

  # --- JPA / Hibernate ---
  jpa:
    hibernate:
      ddl-auto: validate   # Hibernate only CHECKS the schema, never changes it
    show-sql: false
    properties:
      hibernate:
        format_sql: true

server:
  port: 8100
