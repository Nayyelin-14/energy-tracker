spring:
  application:
    name: ingestion-service

  kafka:
    bootstrap-servers: localhost:9094
    template:
      default-topic: energy-usage
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

server:
  port: 8104

simulation:
  interval-ms: 5000
  endpoint: http://localhost:8104/api/v1/ingestion
  requests-per-interval: 1000
  parallel-threads: 10

device:
  service:
    url: http://localhost:8101/api/v1/device

user:
  service:
    url: http://localhost:8100/api/v1/user

influx:
  url: http://localhost:8072
  token: my-token
  org: nay
  bucket: usage-bucket

demo:
  seed:
    enabled: true
    email: demo@energytracker.dev
    password: Demo123!
    name: Demo User
    threshold: 500.0
    alerting: true
