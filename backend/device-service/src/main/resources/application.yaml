spring:
  application:
    name: device-service

  # --- MySQL ---
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:home_energy_tracker}?sslMode=DISABLED&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:energy_app}
    password: ${MYSQL_PASSWORD:EnergyApp_2026_Strong!}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # --- JPA / Hibernate ---
  jpa:
    hibernate:
      ddl-auto: validate   # Flyway owns the schema; Hibernate only CHECKS it
    show-sql: false
    properties:
      hibernate:
        format_sql: true

server:
  port: 8101
